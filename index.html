<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>もち出口</title>
<style>
  :root{
    --bg0:#0c0f1a; --bg1:#1a2140;
    --accent:#ffb37a; --accent2:#ff8fb3;
    --line:rgba(255,255,255,.14);
    --text:#f4f1ea;
    --good:#7ddba4; --bad:#ff9a92;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:radial-gradient(120% 120% at 50% 0%,var(--bg1),var(--bg0) 75%);
    color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    user-select:none;
  }
  /* 100vh はスマホのアドレスバー表示中に可視領域より大きくなり上端が見切れる。dvh を優先 */
  #stage{position:relative;width:min(100vw,620px);height:min(100vh,900px);height:min(100dvh,900px);overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;}
  .screen.active{display:flex;}

  /* ===== タイトル ===== */
  #title{justify-content:center;padding:24px;text-align:center;position:relative;
    background:url('art/keyart.png') center/cover no-repeat;}
  #title::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(12,15,26,.35) 0%,rgba(12,15,26,.72) 65%,rgba(12,15,26,.88) 100%);}
  #title>*{position:relative;z-index:1;}
  .logo{font-size:clamp(30px,9vw,46px);font-weight:900;letter-spacing:.06em;line-height:1.25;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(255,179,122,.35));}
  .sub{margin-top:8px;font-size:12px;letter-spacing:.28em;color:var(--accent);opacity:.9;}
  .rule{margin:20px auto 0;max-width:340px;padding:14px 18px;border-radius:14px;
    background:rgba(12,15,26,.55);border:1px solid var(--line);
    font-size:13px;line-height:1.9;text-align:left;}
  .rule b{color:var(--accent);}
  .btn{margin-top:22px;cursor:pointer;user-select:none;border:none;
    padding:15px 46px;font-size:18px;font-weight:800;letter-spacing:.1em;
    color:#2a1608;border-radius:40px;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    box-shadow:0 0 26px rgba(255,143,179,.4);
    transition:transform .12s,box-shadow .2s;touch-action:manipulation;}
  .btn:hover{transform:translateY(-2px) scale(1.03);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:none;color:var(--text);border:1px solid var(--line);
    box-shadow:none;font-size:13px;padding:10px 22px;letter-spacing:.06em;margin-top:12px;}
  #bestLabel,#playCountLabel{margin-top:12px;font-size:12px;opacity:.6;min-height:14px;}

  /* ===== プレイ ===== */
  #play{justify-content:flex-start;}
  #hud{width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px;font-size:13px;letter-spacing:.04em;}
  #hud .chip{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;
    padding:6px 12px;font-variant-numeric:tabular-nums;}
  #hud .chip b{color:var(--accent);}
  #quitBtn{background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer;}
  /* canvas とボタンを同じflexカラムに通常フローで並べ、まとめて中央へ寄せる
     (position:absolute;bottom:0 だとcanvasから遠く離れて押しにくい) */
  #canvasWrap{position:relative;width:100%;flex:1;min-height:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  canvas#game{display:block;flex:none;touch-action:none;background:#1a2140;border-radius:6px;}
  #msg{min-height:22px;font-size:14px;letter-spacing:.06em;text-align:center;padding:0 16px;
    transition:opacity .2s;}
  #msg.good{color:var(--good);} #msg.bad{color:var(--bad);}
  #choiceRow{display:flex;gap:14px;width:100%;max-width:480px;padding:0 16px;flex:none;}
  .choice{flex:1;padding:18px 8px;font-size:17px;font-weight:800;letter-spacing:.06em;
    border-radius:16px;border:1px solid var(--line);cursor:pointer;color:var(--text);
    background:rgba(255,255,255,.08);touch-action:none;-webkit-touch-callout:none;
    transition:transform .1s,background .15s;}
  .choice:active{transform:scale(.96);background:rgba(255,255,255,.2);}
  .choice.go{background:linear-gradient(90deg,var(--accent2),var(--accent));color:#2a1608;border:none;
    box-shadow:0 0 20px rgba(255,143,179,.35);}
  .choice[disabled]{opacity:.45;pointer-events:none;}

  /* ===== 結果 ===== */
  #result{justify-content:center;padding:24px;text-align:center;}
  #result h2{font-size:26px;letter-spacing:.06em;margin-bottom:6px;color:var(--good);}
  #resultStats{margin:14px 0 6px;font-size:14px;line-height:2.1;
    background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;
    padding:14px 22px;min-width:240px;}
  #resultStats b{color:var(--accent);font-size:17px;}
  #resultStats .new{color:var(--good);font-size:12px;margin-left:6px;}
</style>
</head>
<body>
<div id="stage">

  <!-- ================= タイトル ================= -->
  <section id="title" class="screen active">
    <div class="logo">もち出口</div>
    <div class="sub">MOCHI EXIT</div>
    <div class="rule">
      和菓子商店街の通路をくり返し歩く。<br>
      いつもと<b>違うところ（異変）</b>があれば <b>◀ 引き返す</b>、<br>
      なにも無ければ <b>進む ▶</b>。<br>
      正解を重ねて <b>出口8</b> にたどり着けば脱出。<br>
      間違えると出口0からやり直し。
    </div>
    <button class="btn" id="startBtn">はじめる</button>
    <div id="bestLabel"></div>
    <div id="playCountLabel"></div>
  </section>

  <!-- ================= プレイ ================= -->
  <section id="play" class="screen">
    <div id="hud">
      <div class="chip">出口 <b id="hudRound">0</b> / 8</div>
      <div class="chip">ミス <b id="hudMiss">0</b></div>
      <button id="quitBtn">タイトルへ</button>
    </div>
    <div id="canvasWrap">
      <canvas id="game"></canvas>
      <div id="msg"></div>
      <div id="choiceRow">
        <button class="choice back" id="backBtn">◀ 引き返す</button>
        <button class="choice go" id="goBtn">進む ▶</button>
      </div>
    </div>
  </section>

  <!-- ================= 結果 ================= -->
  <section id="result" class="screen">
    <h2>脱出成功！</h2>
    <div id="resultStats"></div>
    <button class="btn" id="retryBtn">もういちど</button><br>
    <button class="btn ghost" id="toTitleBtn">タイトルへ</button>
  </section>

</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);

  /* =========================================================
     1. Sfx — 効果音 + BGM(先読みスケジューラ)。mochi-jump から移植し、
        曲調だけ「かわいいが少し不穏」(テンポを落とし短調寄り)に変えた。
     ========================================================= */
  const Sfx = (function(){
    let ac = null;
    function ensure(){ if(!ac){ const AC = window.AudioContext || window.webkitAudioContext; ac = new AC(); } if(ac.state === "suspended") ac.resume(); }
    function tone(freq, dur, type, gain, glideTo, delay){
      if(!ac) return;
      const t0 = ac.currentTime + (delay || 0);
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      if(glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain || 0.18, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t0); osc.stop(t0 + dur + 0.02);
    }
    const BGM_BPM = 96;
    const bgmStepSec = 60 / BGM_BPM / 4;
    const SCHEDULE_AHEAD = 0.6, SCHED_INTERVAL_MS = 50, BGM_STEPS = 64;
    function noteHz(semi){ return 110 * Math.pow(2, semi / 12); }
    function degreeSemi(chord, deg){
      if (deg === 3) return chord.tones[0] + 12;
      if (deg === 4) return chord.tones[2] + 12;
      return chord.tones[deg];
    }
    // A=0。Am7 → Dm7 → E7 → Am7 の短調ループ。少し不穏な和菓子屋の夕暮れ
    const CHORDS = [
      { tones:[0,3,7,10],  bass:0  },   // Am7
      { tones:[5,8,12,15], bass:-7 },   // Dm7
      { tones:[7,11,14,17],bass:-5 },   // E7
      { tones:[0,3,7,10],  bass:0  },   // Am7
    ];
    const LEAD = [
      [0,null,null,2, null,null,1,null, 3,null,null,2, null,null,null,null],
      [0,null,null,null, 2,null,1,null, null,null,3,null, 2,null,null,null],
      [4,null,null,3, null,null,2,null, 1,null,null,null, 2,null,null,null],
      [0,null,null,null, null,null,null,null, 3,null,2,null, null,null,null,null],
    ];
    const BASSLINE = [
      [0,null,null,null, null,null,0,null, 0,null,null,null, null,null,0,null],
      [0,null,null,null, null,null,0,null, 0,null,null,null, null,null,null,null],
      [0,null,null,null, null,null,0,null, 0,null,null,null, null,null,0,null],
      [0,null,null,null, null,null,0,null, 0,null,null,null, null,0,null,null],
    ];
    let bgmOn = false, bgmStep = 0, bgmNextAt = 0, bgmTimer = null;
    let noiseBuf = null, busGain = null, hatFilter = null, bassFilter = null;
    let bgmDelay = null, bgmDelayFb = null, bgmDelayWet = null;
    function setupBgmBus(){
      if (!ac || busGain) return;
      busGain = ac.createGain(); busGain.gain.value = 0.42; busGain.connect(ac.destination);
      bgmDelay = ac.createDelay(1.0); bgmDelayFb = ac.createGain(); bgmDelayWet = ac.createGain();
      bgmDelay.delayTime.value = 0.42; bgmDelayFb.gain.value = 0.3; bgmDelayWet.gain.value = 0.18;
      bgmDelay.connect(bgmDelayFb); bgmDelayFb.connect(bgmDelay);
      bgmDelay.connect(bgmDelayWet); bgmDelayWet.connect(busGain);
      hatFilter = ac.createBiquadFilter(); hatFilter.type = "highpass"; hatFilter.frequency.value = 6000; hatFilter.connect(busGain);
      bassFilter = ac.createBiquadFilter(); bassFilter.type = "lowpass"; bassFilter.frequency.value = 380; bassFilter.connect(busGain);
      const len = Math.floor(ac.sampleRate * 0.3);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    function autoRelease(node, g, endAt){ node.onended = function(){ try { node.disconnect(); g.disconnect(); } catch (e) {} }; node.stop(endAt); }
    function noiseHit(at, dur, peak, dest){
      const src = ac.createBufferSource(); src.buffer = noiseBuf;
      const g = ac.createGain(); g.gain.setValueAtTime(peak, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      src.connect(g); g.connect(dest); src.start(at); autoRelease(src, g, at + dur + 0.02);
    }
    function bgmOsc(at, dur, freq, peak, type, dest, freqEnd){
      const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, at);
      if (freqEnd != null) o.frequency.exponentialRampToValueAtTime(freqEnd, at + dur);
      const g = ac.createGain(); g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(peak, at + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
      o.connect(g); g.connect(dest || busGain); o.start(at); autoRelease(o, g, at + dur + 0.03);
    }
    function bgmStepAt(step, at){
      const bar = Math.floor(step / 16) % 4, i = step % 16, chord = CHORDS[bar];
      if (i === 0 || i === 8) bgmOsc(at, 0.2, 120, 0.3, "sine", busGain, 45);
      if (i % 4 === 2) noiseHit(at, 0.025, 0.03, hatFilter);
      const b = BASSLINE[bar][i];
      if (b != null) bgmOsc(at, bgmStepSec * 5, noteHz(chord.bass), 0.26, "triangle", bassFilter);
      if (i % 8 === 0) {
        const dur = bgmStepSec * 7.5;
        chord.tones.forEach(function(t){
          const hz = noteHz(t) * 2;
          bgmOsc(at, dur, hz, 0.04, "triangle", busGain);
          bgmOsc(at, dur, hz * 1.005, 0.018, "sine", busGain);
        });
      }
      const d = LEAD[bar][i];
      if (d != null) {
        const hz = noteHz(degreeSemi(chord, d)) * 4;
        bgmOsc(at, bgmStepSec * 2.2, hz, 0.06, "sine", busGain);
        if (bgmDelay) bgmOsc(at, bgmStepSec * 2.2, hz, 0.03, "sine", bgmDelay);
      }
    }
    function bgmTick(){
      if (!bgmOn || !ac) return;
      const now = ac.currentTime;
      if (bgmNextAt < now - 0.05) { const skip = Math.ceil((now - bgmNextAt) / bgmStepSec); bgmStep += skip; bgmNextAt += skip * bgmStepSec; }
      let guard = 0;
      while (bgmNextAt < now + SCHEDULE_AHEAD && guard++ < 32) {
        try { bgmStepAt(bgmStep % BGM_STEPS, bgmNextAt); } catch (e) {}
        bgmNextAt += bgmStepSec; bgmStep++;
      }
      bgmTimer = setTimeout(bgmTick, SCHED_INTERVAL_MS);
    }
    function startBgm(){ ensure(); if (!ac || bgmOn) return; setupBgmBus(); bgmOn = true; bgmStep = 0; bgmNextAt = ac.currentTime + 0.08; bgmTick(); }
    function stopBgm(){ bgmOn = false; clearTimeout(bgmTimer); }
    return {
      ensure, startBgm, stopBgm,
      step(){ tone(140, 0.08, "triangle", 0.08, 90); },
      good(){ tone(660, 0.12, "sine", 0.14); tone(990, 0.18, "sine", 0.12, null, 0.1); },
      bad(){ tone(220, 0.3, "sawtooth", 0.14, 90); tone(160, 0.35, "square", 0.08, 70, 0.05); },
      clear(){ [523,659,784,1047,1319].forEach((f,i)=> tone(f, 0.3, "triangle", 0.14, null, i*0.1)); }
    };
  })();

  /* =========================================================
     2. PlayCounts — 累計プレイ回数(Firestore)。姉妹プロジェクト共通の rythm-game-mo に
        gameId "mochi-exit" で記録。ローカル配信時はカウントしない。
     ========================================================= */
  const PlayCounts = (function(){
    const PROJECT_ID = "rythm-game-mo";
    const API_KEY = "AIzaSyBBo4f_LqJ2lfdKu8Q11oeiiYq_O-15LSc";
    const ROOT = "https://firestore.googleapis.com/v1/projects/" + PROJECT_ID + "/databases/(default)/documents";
    const IS_LOCAL = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === "file:";
    function increment(gameId){
      if(IS_LOCAL) return Promise.resolve();
      const commitUrl = ROOT + ":commit?key=" + API_KEY;
      const docPath = "projects/" + PROJECT_ID + "/databases/(default)/documents/playCounts/" + encodeURIComponent(gameId);
      const incrementBody = { writes: [{ transform: { document: docPath, fieldTransforms: [{ fieldPath: "count", increment: { integerValue: "1" } }] } }] };
      const createBody = { writes: [{ update: { name: docPath, fields: { count: { integerValue: "1" } } }, currentDocument: { exists: false } }] };
      return fetch(commitUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(incrementBody) })
        .then(function(res){ if(res.ok) return; return fetch(commitUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(createBody) }); })
        .catch(function(e){ console.warn("playCount increment failed:", e); });
    }
    function fetchCount(gameId){
      const url = ROOT + "/playCounts/" + encodeURIComponent(gameId) + "?key=" + API_KEY;
      return fetch(url).then(function(res){ return res.ok ? res.json() : null; })
        .then(function(doc){ if(!doc || !doc.fields || !doc.fields.count) return null; return parseInt(doc.fields.count.integerValue, 10); })
        .catch(function(e){ console.warn("playCount fetch failed:", e); return null; });
    }
    return { increment, fetchCount };
  })();

  /* =========================================================
     3. Best — 最短クリアタイム / 最少ミス(localStorage, JSON 1キー)
     ========================================================= */
  const Best = (function(){
    const KEY = "mochi-exit:best";
    function load(){ try{ const o = JSON.parse(localStorage.getItem(KEY) || "{}"); return { timeMs: o.timeMs || 0, miss: (o.miss == null ? null : o.miss) }; }catch(e){ return { timeMs:0, miss:null }; } }
    function record(timeMs, miss){
      const b = load(); const r = { time:false, miss:false };
      if(!b.timeMs || timeMs < b.timeMs){ b.timeMs = timeMs; r.time = true; }
      if(b.miss == null || miss < b.miss){ b.miss = miss; r.miss = true; }
      try{ localStorage.setItem(KEY, JSON.stringify(b)); }catch(e){}
      return r;
    }
    return { load, record };
  })();

  /* =========================================================
     4. Scene — 通路1枚の「部品の集合」。異変は buildScene() の結果を
        ANOMALIES[].apply() で書き換えるだけで作る(描画側は何も知らない)。
     ========================================================= */
  const VIEW_W = 640, VIEW_H = 400;
  const GROUND_Y = 300;
  const GOAL = 8;

  function buildScene(round){
    return {
      sky:{ top:"#f6c7a2", bottom:"#fde7cf", night:false },
      farShops:{ color:"#c9a58a" },
      wall:{ color:"#fbf1de", plank:"#e6d3b5" },
      noren:{ color:"#4e6fb8", text:"もち" },
      sign:{ text:"もち屋", flip:false },
      lanterns:[ {lit:true}, {lit:true}, {lit:true} ],
      dango:{ colors:["#f6a0b0","#fdfaf3","#9fd69a"] },   // 三色団子は 桃・白・緑 の順
      usu:{ steam:true },
      poster:{ flip:false, color:"#ffd6e0" },
      lamp:{ on:true },
      door:{ open:false },
      exitSign:{ n:round },
      mochi:{ count:1, x:320, size:1.35, eyeTilt:0, cheeks:true, facing:1 },
      cat:false,
      tiles:{ shift:0 },
      shadowDir:1,
      clock:{ hour:8 },
    };
  }

  /* 異変ライブラリ。level 1=明らか, 2=中間, 3=微妙。desc は結果メッセージ用。
     追加するときは apply でシーンを書き換えるだけでよい(自動検証が「見えているか」を検査する)。 */
  const ANOMALIES = [
    { id:"mochi_twins",   level:1, desc:"もちが2匹いた",             apply:s=>{ s.mochi.count = 2; } },
    { id:"lantern_out",   level:1, desc:"真ん中の提灯が消えていた",   apply:s=>{ s.lanterns[1].lit = false; } },
    { id:"door_open",     level:1, desc:"お店の扉が開いていた",       apply:s=>{ s.door.open = true; } },
    { id:"cat",           level:1, desc:"猫がいた",                   apply:s=>{ s.cat = true; } },
    { id:"night",         level:1, desc:"空が夜になっていた",         apply:s=>{ s.sky.night = true; s.sky.top = "#2b2a5a"; s.sky.bottom = "#6b4f8a"; } },
    { id:"mochi_big",     level:1, desc:"もちが大きかった",           apply:s=>{ s.mochi.size = 2.2; } },
    { id:"dango_order",   level:2, desc:"三色団子の色の順番が違った", apply:s=>{ s.dango.colors = ["#9fd69a","#fdfaf3","#f6a0b0"]; } },
    { id:"noren_color",   level:2, desc:"のれんの色が違った",         apply:s=>{ s.noren.color = "#c8503c"; } },
    { id:"sign_typo",     level:3, desc:"看板が「もち家」になっていた", apply:s=>{ s.sign.text = "もち家"; } },
    { id:"lamp_off",      level:2, desc:"街灯が消えていた",           apply:s=>{ s.lamp.on = false; } },
    { id:"no_steam",      level:2, desc:"臼の湯気が出ていなかった",   apply:s=>{ s.usu.steam = false; } },
    { id:"poster_color",  level:2, desc:"ポスターの色が違った",       apply:s=>{ s.poster.color = "#c4e3ff"; } },
    { id:"lantern_extra", level:2, desc:"提灯が4つあった",            apply:s=>{ s.lanterns.push({lit:true}); } },
    { id:"mochi_facing",  level:2, desc:"もちが逆を向いていた",       apply:s=>{ s.mochi.facing = -1; } },
    { id:"poster_flip",   level:3, desc:"ポスターが左右反転していた", apply:s=>{ s.poster.flip = true; } },
    { id:"mochi_eyes",    level:3, desc:"もちの目がつり上がっていた", apply:s=>{ s.mochi.eyeTilt = 1; } },
    { id:"exit_number",   level:3, desc:"出口の番号が違っていた",     apply:s=>{ s.exitSign.n = (s.exitSign.n + 3) % 10; } },
    { id:"tiles_shift",   level:3, desc:"床のタイルがずれていた",     apply:s=>{ s.tiles.shift = 1; } },
    { id:"shadow",        level:3, desc:"影の向きが逆だった",         apply:s=>{ s.shadowDir = -1; } },
    { id:"no_cheeks",     level:3, desc:"もちのほっぺが無かった",     apply:s=>{ s.mochi.cheeks = false; } },
    { id:"clock",         level:3, desc:"時計の針がずれていた",       apply:s=>{ s.clock.hour = 5; } },
  ];
  const ANOMALY_BY_ID = {};
  ANOMALIES.forEach(a => { ANOMALY_BY_ID[a.id] = a; });

  /* 出題: 出現率 ANOMALY_RATE。使った異変は一巡するまで再出題しない。
     round が進むほど微妙な異変(level 3)が混ざる。 */
  const ANOMALY_RATE = 0.6;
  let usedIds = new Set();
  function allowedLevels(round){ return round < 3 ? [1] : round < 6 ? [1,2] : [1,2,3]; }
  function pickAnomaly(round, rng){
    rng = rng || Math.random;
    if(rng() >= ANOMALY_RATE) return null;
    const levels = allowedLevels(round);
    let pool = ANOMALIES.filter(a => levels.includes(a.level) && !usedIds.has(a.id));
    if(pool.length === 0){
      ANOMALIES.filter(a => levels.includes(a.level)).forEach(a => usedIds.delete(a.id));
      pool = ANOMALIES.filter(a => levels.includes(a.level));
    }
    // 高い level をやや優先(round が進んだら微妙な異変を出したい)
    const weights = pool.map(a => a.level === Math.max.apply(null, levels) ? 2 : 1);
    let r = rng() * weights.reduce((x,y)=>x+y, 0);
    for(let i = 0; i < pool.length; i++){ r -= weights[i]; if(r < 0){ usedIds.add(pool[i].id); return pool[i]; } }
    usedIds.add(pool[pool.length-1].id); return pool[pool.length-1];
  }

  /* =========================================================
     5. 描画 — 部品ごとの draw 関数。camX で横スクロール(歩行演出)する。
     ========================================================= */
  const canvas = $("game"), ctx = canvas.getContext("2d");
  function fitCanvas(){
    const wrap = $("canvasWrap");
    const scale = Math.min(wrap.clientWidth / VIEW_W, Math.max(120, wrap.clientHeight - 130) / VIEW_H);
    canvas.width = VIEW_W; canvas.height = VIEW_H;
    canvas.style.width = (VIEW_W*scale) + "px";
    canvas.style.height = (VIEW_H*scale) + "px";
  }
  window.addEventListener("resize", fitCanvas);

  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function drawSky(s){
    const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
    g.addColorStop(0, s.sky.top); g.addColorStop(1, s.sky.bottom);
    ctx.fillStyle = g; ctx.fillRect(0,0,VIEW_W,GROUND_Y);
    if(s.sky.night){
      ctx.fillStyle = "rgba(255,255,255,.8)";
      for(let i=0;i<26;i++){ const x=(i*97)%VIEW_W, y=(i*53)%160+10; ctx.fillRect(x,y,2,2); }
      ctx.fillStyle = "#fff4c8"; ctx.beginPath(); ctx.arc(560,60,18,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.55)";
      [[80,60,34],[120,70,26],[420,48,30],[470,58,22]].forEach(c=>{ ctx.beginPath(); ctx.arc(c[0],c[1],c[2],0,Math.PI*2); ctx.fill(); });
    }
  }
  function drawFarShops(s, cam){
    ctx.save(); ctx.translate(-cam*0.3, 0);
    ctx.fillStyle = s.farShops.color;
    for(let i=-1;i<5;i++){ const x=i*220+30; ctx.fillRect(x,180,160,120); ctx.fillStyle="#b08c72"; ctx.fillRect(x-8,172,176,14); ctx.fillStyle=s.farShops.color; }
    ctx.restore();
  }
  function drawFloor(s, cam){
    ctx.fillStyle = "#e9d9bd"; ctx.fillRect(0,GROUND_Y,VIEW_W,VIEW_H-GROUND_Y);
    ctx.strokeStyle = "rgba(120,90,60,.35)"; ctx.lineWidth = 2;
    const tw = 64;
    for(let row=0; row<3; row++){
      const y = GROUND_Y + row*34;
      ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(VIEW_W,y); ctx.stroke();
      const off = ((row%2)*tw/2 + (row===1 && s.tiles.shift ? 18 : 0) - cam) % tw;
      for(let x=off-tw; x<VIEW_W+tw; x+=tw){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+34); ctx.stroke(); }
    }
    ctx.fillStyle = "#c9a883"; ctx.fillRect(0,GROUND_Y-4,VIEW_W,6);
  }
  function drawShop(s, cam){
    ctx.save(); ctx.translate(-cam, 0);
    const x0 = 60, w = 400, top = 110;
    ctx.fillStyle = s.wall.color; ctx.fillRect(x0, top, w, GROUND_Y-top);
    ctx.fillStyle = s.wall.plank;
    for(let y=top+30; y<GROUND_Y; y+=28) ctx.fillRect(x0, y, w, 4);
    // 屋根
    ctx.fillStyle = "#8c5a3c"; ctx.fillRect(x0-16, top-26, w+32, 30);
    ctx.fillStyle = "#6f4630"; for(let x=x0-16; x<x0+w+16; x+=24) ctx.fillRect(x, top-26, 12, 30);
    // 看板
    ctx.save(); if(s.sign.flip){ ctx.translate(x0+w/2, 0); ctx.scale(-1,1); ctx.translate(-(x0+w/2),0); }
    ctx.fillStyle = "#3b2a1e"; rr(x0+130, top-70, 140, 40, 8); ctx.fill();
    ctx.fillStyle = "#ffe9b8"; ctx.font = "bold 30px 'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(s.sign.text, x0+200, top-50);
    ctx.restore();
    // のれん
    const nx = x0+150, ny = top+8, nw = 120, nh = 70;
    ctx.fillStyle = s.noren.color;
    for(let i=0;i<3;i++){ ctx.fillRect(nx+i*40+2, ny, 36, nh); }
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px 'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
    ctx.fillText(s.noren.text, nx+nw/2, ny+nh/2+2);
    // 扉
    const dx = x0+300, dy = top+60, dw = 62, dh = GROUND_Y-dy;
    ctx.fillStyle = "#5a3a26"; ctx.fillRect(dx-4, dy-4, dw+8, dh+4);
    if(s.door.open){
      ctx.fillStyle = "#1c1410"; ctx.fillRect(dx, dy, dw, dh);
      ctx.fillStyle = "#b98a63"; ctx.fillRect(dx-18, dy, 20, dh);
    } else {
      ctx.fillStyle = "#c79a6c"; ctx.fillRect(dx, dy, dw, dh);
      ctx.strokeStyle = "#8f6a48"; ctx.lineWidth = 2; ctx.strokeRect(dx+8, dy+10, dw-16, dh-20);
      ctx.fillStyle = "#3b2a1e"; ctx.beginPath(); ctx.arc(dx+dw-14, dy+dh/2, 3, 0, Math.PI*2); ctx.fill();
    }
    // ポスター
    ctx.save();
    const px = x0+30, py = top+50, pw = 70, ph = 90;
    if(s.poster.flip){ ctx.translate(px+pw/2, 0); ctx.scale(-1,1); ctx.translate(-(px+pw/2),0); }
    ctx.fillStyle = s.poster.color; ctx.fillRect(px, py, pw, ph);
    ctx.strokeStyle = "#a88"; ctx.lineWidth = 2; ctx.strokeRect(px, py, pw, ph);
    ctx.fillStyle = "#e0607a"; ctx.beginPath(); ctx.arc(px+22, py+34, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#5b8a5e"; ctx.fillRect(px+40, py+22, 20, 24);
    ctx.fillStyle = "#3b2a1e"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("新作", px+8, py+70);
    ctx.restore();
    // 時計
    const cx = x0+w-60, cy = top+30;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#3b2a1e"; ctx.lineWidth = 2; ctx.stroke();
    const ang = (s.clock.hour/12)*Math.PI*2 - Math.PI/2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineWidth = 4; ctx.lineTo(cx+Math.cos(ang)*15, cy+Math.sin(ang)*15); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy-18); ctx.stroke();
    ctx.restore();
  }
  function drawLanterns(s, cam){
    ctx.save(); ctx.translate(-cam, 0);
    const n = s.lanterns.length, x0 = 90, gap = n > 3 ? 80 : 110;
    ctx.strokeStyle = "#6b4a35"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(40, 12); ctx.lineTo(480, 12); ctx.stroke();
    s.lanterns.forEach((l, i) => {
      const x = x0 + i*gap, y = 30;
      ctx.strokeStyle = "#3b2a1e"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, 12); ctx.lineTo(x, y-14); ctx.stroke();
      if(l.lit){ ctx.fillStyle = "rgba(255,190,90,.28)"; ctx.beginPath(); ctx.arc(x, y+4, 26, 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle = l.lit ? "#ff8a5c" : "#8a5a4a";
      ctx.beginPath(); ctx.ellipse(x, y+4, 12, 17, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1;
      for(let k=-8;k<=8;k+=8){ ctx.beginPath(); ctx.moveTo(x-11, y+4+k); ctx.lineTo(x+11, y+4+k); ctx.stroke(); }
      ctx.fillStyle = "#3b2a1e"; ctx.fillRect(x-6, y-14, 12, 5); ctx.fillRect(x-6, y+19, 12, 5);
    });
    ctx.restore();
  }
  function drawStand(s, cam){
    ctx.save(); ctx.translate(-cam, 0);
    // 団子の台
    const x = 175, y = GROUND_Y-70;
    ctx.fillStyle = "#8c5a3c"; ctx.fillRect(x, y, 110, 8); ctx.fillRect(x+6, y+8, 8, 62); ctx.fillRect(x+96, y+8, 8, 62);
    ctx.fillStyle = "#fff8e8"; ctx.beginPath(); ctx.ellipse(x+55, y-4, 44, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#8c5a3c"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x+14, y-8); ctx.lineTo(x+98, y-8); ctx.stroke();
    s.dango.colors.forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x+30+i*26, y-10, 11, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.lineWidth = 1; ctx.stroke(); });
    // 臼と杵
    const ux = 520, uy = GROUND_Y;
    ctx.fillStyle = "#a9754f"; rr(ux-34, uy-58, 68, 58, 10); ctx.fill();
    ctx.fillStyle = "#c98f63"; ctx.beginPath(); ctx.ellipse(ux, uy-58, 34, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fdfaf3"; ctx.beginPath(); ctx.ellipse(ux, uy-58, 24, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.save(); ctx.translate(ux+20, uy-70); ctx.rotate(-0.6);
    ctx.fillStyle = "#c98f63"; ctx.fillRect(-4, -60, 8, 60); ctx.fillStyle = "#a9754f"; rr(-14, -84, 28, 28, 6); ctx.fill(); ctx.restore();
    if(s.usu.steam){
      ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = 3;
      for(let k=0;k<3;k++){ ctx.beginPath(); ctx.moveTo(ux-14+k*14, uy-66); ctx.quadraticCurveTo(ux-6+k*14, uy-84, ux-14+k*14, uy-100); ctx.stroke(); }
    }
    ctx.restore();
  }
  function drawLamp(s, cam){
    ctx.save(); ctx.translate(-cam, 0);
    const x = 600;
    ctx.fillStyle = "#3b3f4a"; ctx.fillRect(x-4, 90, 8, GROUND_Y-90); ctx.fillRect(x-14, GROUND_Y-8, 28, 8);
    ctx.fillStyle = "#3b3f4a"; rr(x-14, 70, 28, 26, 6); ctx.fill();
    ctx.fillStyle = s.lamp.on ? "#ffe9a0" : "#6d6a5a"; rr(x-10, 74, 20, 18, 4); ctx.fill();
    if(s.lamp.on){ ctx.fillStyle = "rgba(255,235,160,.18)"; ctx.beginPath(); ctx.moveTo(x-12, 92); ctx.lineTo(x+12, 92); ctx.lineTo(x+70, GROUND_Y); ctx.lineTo(x-70, GROUND_Y); ctx.closePath(); ctx.fill(); }
    ctx.restore();
  }
  function drawExitSign(s, cam){
    ctx.save(); ctx.translate(-cam, 0);
    const x = 480, y = 44;
    ctx.fillStyle = "#1f8a4c"; rr(x, y, 110, 40, 6); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 24px 'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("出口 " + s.exitSign.n, x+55, y+21);
    ctx.fillStyle = "#3b3f4a"; ctx.fillRect(x+52, y+40, 6, 30);
    ctx.restore();
  }
  function drawMochi(x, y, m, s){
    ctx.save(); ctx.translate(x, y); ctx.scale(m.facing*m.size, m.size);
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(6*s.shadowDir*m.facing, 20, 22, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#fdfaf3"; ctx.beginPath(); ctx.ellipse(0, 4, 19, 17, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = "#d8c9a8"; ctx.lineWidth = 1.4; ctx.stroke();
    if(m.cheeks){ ctx.fillStyle = "#ffb0b8"; ctx.beginPath(); ctx.ellipse(-9, 6, 4.2, 3, 0, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(9, 6, 4.2, 3, 0, 0, Math.PI*2); ctx.fill(); }
    // 持っている団子串(進行方向側)。左右対称だと「逆を向く」異変が見えないため
    ctx.strokeStyle = "#8c5a3c"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(14, 8); ctx.lineTo(30, -14); ctx.stroke();
    [[26,-9,"#f6a0b0"],[22,-3,"#fdfaf3"],[18,3,"#9fd69a"]].forEach(d=>{ ctx.fillStyle = d[2]; ctx.beginPath(); ctx.arc(d[0], d[1], 4.2, 0, Math.PI*2); ctx.fill(); });
    ctx.fillStyle = "#2a2a2a";
    if(m.eyeTilt){
      ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = 2.4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-11,-4); ctx.lineTo(-3,1); ctx.moveTo(11,-4); ctx.lineTo(3,1); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(-7,-1,2.6,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(7,-1,2.6,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  function drawCat(x, y){
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "#3a3a3a";
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 11, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-16, -8, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-23,-13); ctx.lineTo(-21,-24); ctx.lineTo(-15,-15); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-9,-13); ctx.lineTo(-11,-24); ctx.lineTo(-17,-15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#3a3a3a"; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(16,-2); ctx.quadraticCurveTo(30,-6,26,-20); ctx.stroke();
    ctx.fillStyle = "#ffd34e"; ctx.beginPath(); ctx.arc(-19,-9,1.6,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(-13,-9,1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function drawActors(s, cam, t){
    ctx.save(); ctx.translate(-cam, 0);
    const bob = Math.sin(t/220) * 1.5;
    for(let i=0;i<s.mochi.count;i++) drawMochi(s.mochi.x + i*56, GROUND_Y-22+bob, s.mochi, s);
    if(s.cat) drawCat(455, GROUND_Y-8);
    ctx.restore();
  }
  function renderScene(s, cam, t){
    ctx.clearRect(0,0,VIEW_W,VIEW_H);
    drawSky(s); drawFarShops(s, cam); drawFloor(s, cam);
    drawShop(s, cam); drawLanterns(s, cam); drawStand(s, cam); drawLamp(s, cam); drawExitSign(s, cam);
    drawActors(s, cam, t);
    if(s.sky.night){ ctx.fillStyle = "rgba(20,10,50,.28)"; ctx.fillRect(0,0,VIEW_W,VIEW_H); }
  }

  /* =========================================================
     6. Game — 状態機械。idle(選択待ち) → walking(演出) → 次シーン。
     ========================================================= */
  const SCREENS = ["title","play","result"];
  function show(id){ SCREENS.forEach(s => $(s).classList.toggle("active", s === id)); }

  let round = 0, miss = 0, startedAt = 0;
  let scene = null, anomaly = null, forced = undefined;
  let phase = "idle";          // idle | walking | fading | ended
  let camX = 0, rafId = null, lastMsgTimer = null;

  function newScene(){
    scene = buildScene(round);
    anomaly = (forced !== undefined) ? (forced ? ANOMALY_BY_ID[forced] || null : null) : pickAnomaly(round);
    forced = undefined;
    if(anomaly) anomaly.apply(scene);
    camX = 0;
    renderScene(scene, 0, performance.now());
  }
  function paintHud(){ $("hudRound").textContent = round; $("hudMiss").textContent = miss; }
  function setMsg(text, cls){
    const m = $("msg"); m.textContent = text; m.className = cls || "";
    clearTimeout(lastMsgTimer);
    if(text) lastMsgTimer = setTimeout(() => { m.textContent = ""; m.className = ""; }, 2600);
  }
  function setChoices(enabled){ $("goBtn").disabled = !enabled; $("backBtn").disabled = !enabled; }

  function choose(dir){                    // dir: "go" | "back"
    if(phase !== "idle") return;
    const hadAnomaly = !!anomaly;
    const correct = hadAnomaly ? dir === "back" : dir === "go";
    if(correct){
      round++; Sfx.good();
      setMsg(hadAnomaly ? "正解：" + anomaly.desc : "正解：異変はなかった", "good");
    } else {
      miss++; Sfx.bad();
      setMsg(hadAnomaly ? "見逃した… " + anomaly.desc : "異変は無かった… 出口0に戻る", "bad");
      round = 0;
    }
    paintHud();
    walk(dir === "go" ? 1 : -1, () => {
      if(round >= GOAL){ finish(); return; }
      newScene(); phase = "idle"; setChoices(true);
    });
  }
  function walk(dirSign, done){
    phase = "walking"; setChoices(false);
    const t0 = performance.now(), DUR = 750, FADE = 220;
    let stepAt = 0;
    function frame(now){
      const t = Math.min(1, (now - t0) / DUR);
      camX = dirSign * VIEW_W * 0.55 * t * t;
      renderScene(scene, camX, now);
      if(now - stepAt > 240){ Sfx.step(); stepAt = now; }
      const fade = t < 0.75 ? 0 : (t - 0.75) / 0.25;
      if(fade > 0){ ctx.fillStyle = "rgba(10,8,20," + fade + ")"; ctx.fillRect(0,0,VIEW_W,VIEW_H); }
      if(t < 1){ rafId = requestAnimationFrame(frame); return; }
      // 暗転から次シーンをフェードイン
      done();
      const f0 = performance.now();
      function fadeIn(now2){
        const u = Math.min(1, (now2 - f0) / FADE);
        renderScene(scene, 0, now2);
        ctx.fillStyle = "rgba(10,8,20," + (1-u) + ")"; ctx.fillRect(0,0,VIEW_W,VIEW_H);
        if(u < 1) rafId = requestAnimationFrame(fadeIn); else rafId = null;
      }
      if(phase !== "ended") rafId = requestAnimationFrame(fadeIn);
    }
    rafId = requestAnimationFrame(frame);
  }
  function startGame(){
    Sfx.ensure(); Sfx.startBgm();
    PlayCounts.increment("mochi-exit");
    round = 0; miss = 0; usedIds = new Set(); startedAt = performance.now();
    phase = "idle"; paintHud(); setMsg(""); setChoices(true);
    show("play"); fitCanvas(); newScene();
  }
  function finish(){
    phase = "ended"; Sfx.stopBgm(); Sfx.clear();
    if(rafId) cancelAnimationFrame(rafId); rafId = null;
    const ms = performance.now() - startedAt;
    const r = Best.record(ms, miss);
    $("resultStats").innerHTML =
      "クリアタイム <b>" + (ms/1000).toFixed(1) + "</b> 秒" + (r.time ? '<span class="new">NEW!</span>' : "") + "<br>" +
      "ミス <b>" + miss + "</b> 回" + (r.miss ? '<span class="new">NEW!</span>' : "");
    paintBest();
    show("result");
  }
  function quit(){ phase = "ended"; Sfx.stopBgm(); if(rafId) cancelAnimationFrame(rafId); rafId = null; paintBest(); show("title"); }
  function paintBest(){
    const b = Best.load();
    $("bestLabel").textContent = b.timeMs ? ("自己ベスト " + (b.timeMs/1000).toFixed(1) + "秒 / ミス" + b.miss + "回") : "";
  }

  // pointerdown で即反応(click だと指を離すまで遅れる)。キーボードは ←/→
  function bindChoice(id, dir){
    const el = $(id);
    el.addEventListener("pointerdown", function(e){ e.preventDefault(); choose(dir); });
    el.addEventListener("click", function(e){ e.preventDefault(); if(e.detail === 0) choose(dir); });
    el.addEventListener("contextmenu", e => e.preventDefault());
  }
  bindChoice("goBtn", "go"); bindChoice("backBtn", "back");
  window.addEventListener("keydown", function(e){
    if(!$("play").classList.contains("active")) return;
    if(e.key === "ArrowRight"){ e.preventDefault(); choose("go"); }
    if(e.key === "ArrowLeft"){ e.preventDefault(); choose("back"); }
  });
  $("startBtn").addEventListener("click", startGame);
  $("retryBtn").addEventListener("click", startGame);
  $("toTitleBtn").addEventListener("click", quit);
  $("quitBtn").addEventListener("click", quit);
  document.addEventListener("visibilitychange", function(){ if(document.hidden) Sfx.stopBgm(); else if($("play").classList.contains("active") && phase !== "ended") Sfx.startBgm(); });
  window.addEventListener("pagehide", function(){ Sfx.stopBgm(); });

  fitCanvas(); paintBest();
  PlayCounts.fetchCount("mochi-exit").then(function(c){ if(c != null) $("playCountLabel").textContent = "これまでに " + c.toLocaleString() + " 回プレイされています"; });

  /* テスト用フック */
  window.__exit = {
    debugState(){ return { round, miss, phase, anomaly: anomaly ? anomaly.id : null, used: Array.from(usedIds) }; },
    forceAnomaly(id){ forced = id; },            // null=異変なし, id=その異変, undefined=ランダムに戻す
    choose, startGame,
    anomalies: ANOMALIES.map(a => ({ id:a.id, level:a.level, desc:a.desc })),
    renderOnly(id, r){ const s = buildScene(r == null ? round : r); if(id) ANOMALY_BY_ID[id].apply(s); renderScene(s, 0, 1000); return canvas.toDataURL(); },
    pickAnomaly, resetUsed(){ usedIds = new Set(); },
  };
})();
</script>
</body>
</html>
